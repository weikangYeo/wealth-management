
# Collection of services for local development, Dev could start up individual service respectively if needed.
name: wealth-management-stack
services:
  wealth-management-rds:
    container_name: wealth-mgmt-db
    image: mysql:9.3.0
    environment:
      - MYSQL_ROOT_PASSWORD=root
      - MYSQL_USER=user
      - MYSQL_PASSWORD=user
    ports:
      - 3307:3306
    volumes:
      - ./database/init:/docker-entrypoint-initdb.d
      - mysql-data:/var/lib/mysql
    command: mysqld --lower_case_table_names=1  --character_set_server=utf8 --explicit_defaults_for_timestamp
    healthcheck:
      test: ["CMD", "mysql", "-h", "localhost", "-uroot", "-proot", "-e", "SELECT 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  mysql-data: